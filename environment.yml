name: underwater-binocular
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.23
  - opencv>=4.8
  - pyyaml>=6.0
  - pip
  - pip:
      - -e .
      - pytest>=7.4
      - ruff>=0.6

# ZED SDK / pyzed is installed by the vendor-supported SDK installer and is
# intentionally not fabricated as a PyPI dependency. Install it separately
# when running ZedSession or the ZED tracking/depth integrations.
